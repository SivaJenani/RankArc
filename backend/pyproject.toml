[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rankly-backend"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "anthropic>=0.40,<1",
  "asyncpg>=0.29,<1",
  "aiofiles>=23,<25",
  "fastapi>=0.115,<1",
  "passlib[bcrypt]>=1.7,<2",
  "pdfplumber>=0.11,<1",
  "Pillow>=10,<12",
  "pydantic-settings>=2.6,<3",
  "python-docx>=1.1,<2",
  "python-jose[cryptography]>=3.3,<4",
  "python-multipart>=0.0.9,<1",
  "pytesseract>=0.3,<1",
  "redis>=5,<6",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "mypy>=1.13,<2", "pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
