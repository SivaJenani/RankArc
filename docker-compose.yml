services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rankly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rankly}
      POSTGRES_DB: ${POSTGRES_DB:-rankly}
    ports:
      - "5432:5432"
    volumes:
      - rankly_postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - rankly_redis_data:/data
volumes:
  rankly_postgres_data:
  rankly_redis_data:

